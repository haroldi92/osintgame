<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACKBOX — Teamranking</title>
<style>
:root{color-scheme:dark;--bg:#090e13;--panel:#101920;--line:#27343f;--muted:#9aaab7;--ink:#edf5fa;--lime:#c7fa76;font-family:Inter,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#1a2b33 0,transparent 60%),var(--bg);color:var(--ink)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#8aa6b705 1px,transparent 1px),linear-gradient(90deg,#8aa6b705 1px,transparent 1px);background-size:36px 36px}header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:23px 5%;border-bottom:1px solid var(--line)}.brand{font-weight:850;letter-spacing:3px;font-size:20px}.brand i{color:var(--lime);font-style:normal}a{color:var(--ink);text-decoration:none}a:hover,a:focus-visible{color:var(--lime)}main{position:relative;max-width:850px;margin:7vh auto;padding:0 24px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;color:var(--lime)}h1{font-size:clamp(42px,8vw,76px);letter-spacing:-3px;margin:16px 0 12px}.muted{color:var(--muted);line-height:1.65;margin-bottom:30px}.panel{background:#101920c9;border:1px solid var(--line);border-radius:13px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:20px 24px;border-bottom:1px solid var(--line)}th{font:11px ui-monospace,monospace;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}td{font-size:18px;overflow-wrap:anywhere}td:last-child,th:last-child{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}td:last-child{color:var(--lime)}tr:last-child td{border-bottom:0}#rankingMessage{padding:26px;color:var(--muted);text-align:center}@media(max-width:520px){th,td{padding:16px 14px}td{font-size:15px}header{flex-wrap:wrap}}
</style>
</head>
<body><header><div class="brand"><i>▧</i> BLACKBOX</div><a href="index.html">← Zur Challenge</a></header>
<main><div class="eyebrow">MISSION / ERGEBNISSE</div><h1>Teamranking.</h1><p class="muted">Abgeschlossene Missionen, sortiert nach Gesamtzeit inklusive Strafzeit.</p><section class="panel" aria-label="Teamranking"><table><thead><tr><th>Teamname</th><th>Zeit</th></tr></thead><tbody id="rankingRows"></tbody></table><p id="rankingMessage" role="status">Lade Ergebnisse …</p></section></main>
